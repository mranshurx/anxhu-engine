  <style>
    /* Font definitions fallback */
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('/media/051742360c26797e-s.p.1bkzbscqrt8rl.woff2') format('woff2');
    }
    :root {
      --color-accent: #ff2a44;
      --color-accent-contrast: #ffffff;
      --color-accent-glow: #ff2a44f2;
      --color-background: #060608;
      --color-foreground: #ffffff;
      --color-dim: #9ca3af;
      --color-mut: #6b7280;
      --color-line-2: #271417;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #060608;
      color: #e5e7eb;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .key-logo {
      width: 104px;
      height: auto;
      filter: drop-shadow(0 0 25px rgba(255, 42, 68, 0.55));
    }
    .key-card {
      max-width: 285px;
      background: rgba(14, 14, 18, 0.88) !important;
      border: 1px solid rgba(255, 42, 68, 0.28) !important;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 35px rgba(255, 42, 68, 0.15) !important;
      backdrop-filter: blur(28px) saturate(180%) !important;
    }
    .hero-logo {
      width: 220px;
      height: auto;
      filter: drop-shadow(0 0 38px rgba(255, 42, 68, 0.65));
    }
    #key-input {
      height: 44px;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border-color: #3b181e;
      text-align: center;
      transition: all 0.2s ease;
    }
    #key-input:focus {
      border-color: #ff2a44;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 16px rgba(255, 42, 68, 0.35);
      outline: none;
    }
    #key-input::placeholder {
      color: #71717a;
    }
    #key-form .btn {
      height: 44px;
      background: linear-gradient(135deg, #ff2a44 0%, #cc001f 100%) !important;
      color: #ffffff !important;
      font-weight: 800;
      letter-spacing: 0.15em;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 18px rgba(255, 42, 68, 0.45);
      transition: all 0.2s ease;
    }
    #key-form .btn:hover:not(:disabled) {
      box-shadow: 0 6px 26px rgba(255, 42, 68, 0.7);
      transform: translateY(-1px);
    }

    #happ-btn {
      background: linear-gradient(135deg, #ff2a44 0%, #cc001f 100%) !important;
      color: #ffffff !important;
      font-weight: 800 !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 18px rgba(255, 42, 68, 0.45);
      transition: all 0.2s ease;
    }
    #happ-btn:hover:not(:disabled) {
      box-shadow: 0 6px 26px rgba(255, 42, 68, 0.7);
      transform: translateY(-1px);
    }

    /* Cards */
    .card {
      background: rgba(14, 14, 18, 0.85) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      border-color: rgba(255, 42, 68, 0.35) !important;
    }

    /* Missing compiled utilities */
    .transition-all { transition: all .2s; }
    .gap-1\.5 { gap: .375rem; }
    .opacity-100 { opacity: 1; }
    .opacity-35 { opacity: .35; }
    .text-\[11px\] { font-size: 11px; }
    .text-\[9\.5px\] { font-size: 9.5px; }
    .tracking-\[0\.08em\] { letter-spacing: .08em; }
    .tracking-\[0\.1em\] { letter-spacing: .1em; }
    .tracking-\[0\.15em\] { letter-spacing: .15em; }
    .tracking-\[0\.2em\] { letter-spacing: .2em; }
    .rounded-\[14px\] { border-radius: 14px; }
    .rounded-\[20px\] { border-radius: 20px; }
    .w-\[68px\] { width: 68px; }
    .p-1\.5 { padding: .375rem; }
    .py-2\.5 { padding-top: .625rem; padding-bottom: .625rem; }
    .top-0\.5 { top: .125rem; }
    .left-0\.5 { left: .125rem; }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .cursor-pointer { cursor: pointer; }
    .shadow-md { box-shadow: 0 4px 6px -1px rgba(0,0,0,.35), 0 2px 4px -2px rgba(0,0,0,.35); }
    .bg-white\/10 { background: rgba(255,255,255,.10); }
    .bg-white\/5 { background: rgba(255,255,255,.05); }
    .bg-white\/\[0\.02\] { background: rgba(255,255,255,.02); }
    .bg-white\/\[0\.03\] { background: rgba(255,255,255,.03); }
    .border-white\/10 { border-color: rgba(255,255,255,.10); }
    .disabled\:opacity-40:disabled { opacity: .4; }
    .hover\:text-foreground:hover { color: #ffffff; }

    /* Feature toggles */
    .toggle-switch { cursor: pointer; transition: all 0.25s ease; }
    .toggle-on { background: #ff2a44 !important; box-shadow: 0 0 12px rgba(255, 42, 68, 0.6) !important; }
    .toggle-off { background: rgba(255,255,255,.12); }
    .toggle-knob-on { left: calc(100% - 1.375rem); background: #ffffff !important; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    .toggle-knob-off { left: .125rem; background: rgba(202,202,202,.7); }

    /* Marker type chips */
    .marker-chip-btn { cursor: pointer; }
    .marker-chip-on {
      background: linear-gradient(135deg, #ff2a44 0%, #b8001b 100%) !important;
      color: #ffffff !important;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      box-shadow: 0 4px 14px rgba(255, 42, 68, 0.45) !important;
    }
    .marker-chip-off { background: rgba(255,255,255,.03); color: #8a8a8e; }
    .marker-chip-off:hover { color: #ffffff; }

    /* Bottom Nav active tab */
    [data-nav-tab].text-foreground {
      background: linear-gradient(135deg, rgba(255, 42, 68, 0.25) 0%, rgba(255, 42, 68, 0.1) 100%) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 42, 68, 0.45) !important;
      box-shadow: 0 0 14px rgba(255, 42, 68, 0.35) !important;
    }

    /* Remaining missing utilities */
    .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }

    .hero-glow { filter: drop-shadow(0 0 45px rgba(255, 42, 68, 0.65)); }
