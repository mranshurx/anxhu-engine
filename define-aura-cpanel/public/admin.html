<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cyber x silent — admin</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/icon.png" />
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #101013;
      --line: #1e1e22;
      --text: #f2f2f4;
      --dim: #8b8b93;
      --accent: #ff2a44;
      --ok: #22c55e;
      --bad: #ef4444;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 18px 80px; }
    .glow {
      position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden;
    }
    .glow i {
      position: absolute; border-radius: 999px; filter: blur(120px); display: block;
    }
    .glow i:nth-child(1) { width: 520px; height: 520px; left: 50%; top: -180px; transform: translateX(-50%); background: rgba(255,42,68,.10); }
    .glow i:nth-child(2) { width: 420px; height: 420px; right: -140px; bottom: -160px; background: rgba(255,42,68,.07); }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }
    .row { display: flex; align-items: center; gap: 12px; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .grid { display: grid; gap: 12px; }
    .g4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

    h1 { font-size: 18px; letter-spacing: .18em; text-transform: uppercase; margin: 0; }
    h2 { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin: 0 0 12px; }
    .muted { color: var(--dim); font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    input, select {
      background: #08080a; border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px 12px; font: inherit; width: 100%; outline: none;
    }
    input:focus, select:focus { border-color: #35353b; }

    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 10px;
      padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer;
      letter-spacing: .08em; text-transform: uppercase; font-size: 12px;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
    button.mini { padding: 6px 10px; font-size: 11px; }
    button.danger { background: transparent; border: 1px solid rgba(239,68,68,.45); color: #fca5a5; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
    tr:hover td { background: rgba(255,255,255,.02); }

    .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .pill.active { background: rgba(34,197,94,.14); color: #4ade80; }
    .pill.revoked { background: rgba(239,68,68,.14); color: #fca5a5; }
    .pill.expired { background: rgba(251,191,36,.14); color: #fcd34d; }
    .pill.bound { background: rgba(59,130,246,.14); color: #93c5fd; }
    .pill.free { background: rgba(255,255,255,.06); color: var(--dim); }

    .stat { text-align: center; }
    .stat b { display: block; font-size: 24px; font-weight: 800; }
    .stat span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }

    .logo { height: 34px; width: auto; border-radius: 8px; }
    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 16px; font-size: 13px; z-index: 60; max-width: 90vw;
    }
    .toast.bad { border-color: rgba(239,68,68,.5); color: #fca5a5; }
    .toast.ok { border-color: rgba(34,197,94,.5); color: #86efac; }
    .hidden { display: none !important; }
    .sep { height: 1px; background: var(--line); margin: 18px 0; }
    .keyscroll { overflow-x: auto; }
    @media (max-width: 640px) {
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"><i></i><i></i></div>

  <!-- LOGIN -->
  <div id="login-view" class="wrap" style="max-width:420px;padding-top:14vh">
    <div class="card" style="text-align:center">
      <img src="/logo.png" alt="Cyber x silent" class="logo" style="height:52px;margin-bottom:14px" />
      <h1>admin panel</h1>
      <p class="muted" style="margin:6px 0 18px">key is verified online</p>
      <form id="login-form" class="grid">
        <input id="login-input" type="password" placeholder="admin key" autocomplete="off" autofocus />
        <button type="submit" id="login-btn">unlock</button>
      </form>
      <p id="login-error" class="muted hidden" style="color:#fca5a5;margin-bottom:0"></p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash-view" class="wrap hidden">
    <div class="between" style="margin-bottom:22px">
      <div class="row">
        <img src="/logo.png" alt="Cyber x silent" class="logo" />
        <div>
          <h1>cyber x silent</h1>
          <div class="muted" id="key-source">verifying admin key…</div>
        </div>
      </div>
      <div class="row">
        <button class="ghost mini" id="refresh-btn">refresh</button>
        <button class="danger mini" id="logout-btn">log out</button>
      </div>
    </div>

    <div class="grid g4" id="stats" style="margin-bottom:18px"></div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:18px">
      <div class="card">
        <h2>generate keys</h2>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
          <label class="muted">count<input id="gen-count" type="number" min="1" max="50" value="1" /></label>
          <label class="muted">days<input id="gen-days" type="number" min="1" value="30" /></label>
          <label class="muted">prefix<input id="gen-prefix" type="text" value="CYBER" /></label>
          <label class="muted">note<input id="gen-note" type="text" value="Generated from Admin Panel" /></label>
        </div>
        <button id="gen-btn" style="margin-top:12px;width:100%">generate</button>
        <div id="gen-out" class="mono muted hidden" style="margin-top:12px;word-break:break-all;font-size:12px"></div>
      </div>

      <div class="card">
        <h2>maintenance</h2>
        <label class="row" style="margin-bottom:10px">
          <input id="mt-enabled" type="checkbox" style="width:auto" />
          <span>enabled</span>
        </label>
        <label class="row" style="margin-bottom:10px">
          <input id="mt-blocked" type="checkbox" style="width:auto" />
          <span>block everyone except allowed logins</span>
        </label>
        <label class="muted">allowed logins (comma separated)
          <input id="mt-allowed" type="text" placeholder="CYBER-XXXX-XXXX-XXXX, ..." />
        </label>
        <label class="muted" style="display:block;margin-top:10px">message
          <input id="mt-message" type="text" />
        </label>
        <button id="mt-btn" style="margin-top:12px;width:100%">save maintenance</button>
      </div>
    </div>

    <div class="card">
      <h2>license keys</h2>
      <div class="keyscroll">
        <table>
          <thead>
            <tr>
              <th>key</th><th>status</th><th>expires</th><th>device</th><th>note</th><th></th>
            </tr>
          </thead>
          <tbody id="keys-body"></tbody>
        </table>
      </div>
      <p id="keys-empty" class="muted hidden" style="margin:14px 0 0">no keys yet — generate one above.</p>
    </div>

    <div class="card" style="margin-top:18px">
      <h2>nodes</h2>
      <div id="nodes-list" class="grid"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/vip/admin.js"></script>
</body>
</html>
